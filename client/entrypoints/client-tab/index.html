<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/icon/128.png" />
  <title data-i18n="extName">Geoguessr Archipelago Client</title>
</head>

<body>
  <div id="status-component">
    <strong><span data-i18n="status">Status</span>: </strong>
    <div id="status">
    </div>
  </div>
  <div id="volume-component">
    <label for="volume-bar" id="volume-bar-icon">
      🔊
    </label>
    <input type="range" id="volume-bar">
  </div>
  <div id="app">
    <h1 data-i18n="pageTitle">Geoguessr Archipelago</h1>
    <hr>
    <div id="connection-section">
      <form id="connect-form">
        <div>
          <label for="server" data-i18n="apServer"></label>
          <input id="server" type="string" placeholder="archipelago.gg:XXXXX">
        </div>
        <div>
          <label for="slot-name" data-i18n="slotName"></label>
          <input id="slot-name" type="string" data-i18n-placeholder="slotNamePlaceholder">
        </div>
        <div>
          <label for="password" data-i18n="password"></label>
          <input id="password" type="password" data-i18n-placeholder="passwordPlaceholder">
        </div>
        <button id="connect-button" type="button" data-i18n="connectButton"></button>
        <button id="disconnect-button" type="button" data-i18n="disconnectButton"></button>
      </form>
      <div id="recent-logs">
        <details>
          <summary data-i18n="recentMessages">s</summary>
          <div id="log-container" class="log-container"></div>
        </details>
      </div>
    </div>
    <hr>
    <div id="game-section">
      <div id="manual-game-submit-section">
        <fieldset>
          <legend id="game-id-submit-section-title" data-i18n="gameIdSubmitSectionTitle"></legend>
          <div id="manual-game-submit-form-line">
            <label for="game-id" data-i18n="gameId"></label>
            <input id="game-id" type="string" data-i18n-placeholder="gameIdPlaceholder">
            <button id="submit-id-button" type="button" data-i18n="submitId"></button>
          </div>
          <span id="submit-id-status"></span>
        </fieldset>
      </div>
      <table id="map-table">
        <thead>
          <tr>
            <th id="map-column" rowspan="2" data-i18n="mapColumn"></th>
            <th colspan="3" data-i18n="gamemodesColumn"></th>
            <th rowspan="2" data-i18n="bestMedalColumn"></th>
            <th rowspan="2" data-i18n="fivekDoneColumn"></th>
          </tr>
          <tr>
            <th id="move-header" class="mode-column" data-i18n="gamemodeMove"></th>
            <th id="pan-header" class="mode-column" data-i18n="gamemodePan"></th>
            <th id="zoom-header" class="mode-column" data-i18n="gamemodeZoom"></th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>
  <footer>
    <a href="../tutorial-tab.html" data-i18n="howToPlay" target="_blank"></a>
  </footer>
  <script type="module" src="./main.ts"></script>
</body>

</html>
