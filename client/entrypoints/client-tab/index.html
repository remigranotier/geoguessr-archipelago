<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/icon/128.png" />
  <title>Geoguessr Archipelago Client</title>
</head>

<body>
  <div id="status-component">
    <strong>Status: </strong>
    <div id="status">
    </div>
  </div>
  <div id="app">
    <h1>Geoguessr Archipelago</h1>
    <hr>
    <div id="connection-section">
      <form id="connect-form">
        <div>
          <label for="server">Archipelago server</label>
          <input id="server" type="string" placeholder="archipelago.gg:XXXXX">
        </div>
        <div>
          <label for="slot-name">Slot name</label>
          <input id="slot-name" type="string" placeholder="<your-name>">
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="(leave empty if none)">
        </div>
        <button id="connect-button" type="button">Connect</button>
        <button id="disconnect-button" type="button">Disconnect</button>
      </form>
      <div id="recent-logs">
        <details>
          <summary>Recent logs</summary>
          <div id="log-container" class="log-container"></div>
        </details>
      </div>
    </div>
    <hr>
    <div id="connect"></div>
    <table id="map-table">
      <thead>
        <tr>
          <th id="map-column" rowspan="2">Map</th>
          <th colspan="3">Gamemodes</th>
          <th rowspan="2">Best medal</th>
          <th rowspan="2">5k done</th>
        </tr>
        <tr>
          <th class="mode-column">Move</th>
          <th class="mode-column">Pan</th>
          <th class="mode-column">Zoom</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
  <footer>
    <a href="../tutorial-tab.html">How to play</a>
  </footer>
  <script type="module" src="./main.ts"></script>
</body>

</html>
