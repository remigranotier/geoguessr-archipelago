<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/icon/128.png" />
  <title>Geoguessr Archipelago Client</title>
</head>

<body>
  <div id="status-component">
    <strong>Status: </strong>
    <div id="status">
    </div>
  </div>
  <div id="app">
    <h1>Geoguessr Archipelago</h1>
    <hr>
    <form id="connect-form">
      <div>
        <label for="server">Archipelago server</label>
        <input id="server" type="string" placeholder="archipelago.gg:XXXXX">
      </div>
      <div>
        <label for="slot-name">Slot name</label>
        <input id="slot-name" type="string" placeholder="<your-name>">
      </div>
      <button id="connect-button" type="submit">Connect</button>
    </form>
    <hr>
    <div id="connect"></div>
    <table id="map-table">
      <thead>
        <tr>
          <th>Map</th>
          <th>Gamemodes</th>
          <th>Timer</th>
          <th>Best score</th>
          <th>Available</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
